<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Arshi 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #ffd6e8, #ffe3f1, #fce1f1, #fff0f7);
  background-size: 400% 400%;
  animation: gradient 10s ease infinite;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

@keyframes gradient {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  text-align: center;
  padding: 20px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 2.2rem;
  color: #333;
  min-height: 60px;
}

button {
  padding: 14px 35px;
  margin: 15px;
  border: none;
  border-radius: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: 0.3s ease;
}

#yesBtn {
  background: #ff4f81;
  color: white;
  box-shadow: 0 10px 25px rgba(255, 79, 129, 0.4);
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: #e0e0e0;
  position: absolute;
}

.message {
  margin-top: 20px;
  font-size: 1.4rem;
  color: #ff2e63;
  opacity: 0;
  transition: opacity 1s ease;
}

.show {
  opacity: 1;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 1;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">
  <h1 id="question"></h1>
  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 🙈</button>

  <div class="message" id="loveMsg">
    You just made my world brighter ✨  
    Thank you for loving quietly and caring deeply 💞
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_6f7d4b1c2c.mp3" type="audio/mpeg">
</audio>

<script>
// Typing effect
const text = "Arshi... will you be my Valentine? 💘";
let i = 0;
function typeEffect() {
  if (i < text.length) {
    document.getElementById("question").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeEffect, 60);
  }
}
typeEffect();

// Move No button
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = `${x}px`;
  noBtn.style.top = `${y}px`;
});

// Create dropdown
let planSelect = document.createElement("select");
planSelect.innerHTML = `
<option value="">Select movie or cafe</option>
<option value="movie">Movie 3:30 PM</option>
<option value="cafe">Cafe 7:30 PM</option>
`;
planSelect.style.padding = "12px 25px";
planSelect.style.borderRadius = "30px";
planSelect.style.border = "none";
planSelect.style.fontSize = "1rem";
planSelect.style.display = "none";
planSelect.style.marginTop = "20px";

document.querySelector(".container").appendChild(planSelect);

// Final message
let finalMessage = document.createElement("div");
finalMessage.style.marginTop = "20px";
finalMessage.style.fontSize = "1.4rem";
finalMessage.style.color = "#ff2e63";
finalMessage.style.display = "none";
finalMessage.innerText = "you deserve both my valentine, let's enjoy the day";

document.querySelector(".container").appendChild(finalMessage);

// Love overlay
let loveOverlay = document.createElement("div");
loveOverlay.style.position = "fixed";
loveOverlay.style.top = "0";
loveOverlay.style.left = "0";
loveOverlay.style.width = "100%";
loveOverlay.style.height = "100%";
loveOverlay.style.pointerEvents = "none";
loveOverlay.style.display = "none";
loveOverlay.style.background = "radial-gradient(circle at center, rgba(255,79,129,0.25), transparent 70%)";
loveOverlay.style.zIndex = "0";
document.body.appendChild(loveOverlay);

// Yes click
document.getElementById("yesBtn").addEventListener("click", () => {
  document.getElementById("loveMsg").classList.add("show");
  document.getElementById("bgMusic").play();
  startConfetti();
  planSelect.style.display = "inline-block";
});

// Dropdown select
planSelect.addEventListener("change", function(){
  if(this.value === "movie" || this.value === "cafe"){
    finalMessage.style.display = "block";
    loveOverlay.style.display = "block";
  }
});

// Confetti
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let pieces = [];

function startConfetti() {
  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      size: Math.random() * 8 + 4,
      speed: Math.random() * 3 + 2
    });
  }
  animate();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pieces.forEach(p => {
    ctx.fillStyle = "pink";
    ctx.fillRect(p.x, p.y, p.size, p.size);
    p.y += p.speed;
  });
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
